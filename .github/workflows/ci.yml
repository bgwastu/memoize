name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test storage, Markdown, search, and synchronization
        run: Scripts/test.sh
      - name: Build and verify the app
        run: Scripts/build.sh
      - name: Exercise native editing and rendering
        timeout-minutes: 3
        run: |
          mkdir -p build/smoke
          MEMOIZE_SMOKE_EDITOR_ONLY=1 MEMOIZE_DATA_DIR="$PWD/build/smoke" build/Memoize.app/Contents/MacOS/Memoize --smoke-test
      - name: Package test build
        run: ditto -c -k --sequesterRsrc --keepParent build/Memoize.app build/Memoize.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: Memoize-ci
          path: |
            build/Memoize.zip
            build/smoke/*.png
          if-no-files-found: ignore
          retention-days: 7
