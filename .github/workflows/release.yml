name: Release
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'macos/**'
      - 'shared/assets/**'
      - 'tools/release/**'
      - '.github/workflows/release.yml'
      - '.release-offset'
      - 'LICENSE'
permissions:
  contents: write
concurrency:
  group: memoize-release
  cancel-in-progress: false
  queue: max
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      android: ${{ steps.platforms.outputs.android }}
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
      macos: ${{ steps.platforms.outputs.macos }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: platforms
        name: Detect changes that affect app releases
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          before, head = os.environ["BEFORE"], os.environ["GITHUB_SHA"]
          exists = subprocess.run(["git", "cat-file", "-e", before + "^{commit}"], stderr=subprocess.DEVNULL).returncode == 0
          command = ["git", "diff", "--no-renames", "--name-only", "-z", before, head] if exists else ["git", "ls-tree", "-r", "--name-only", "-z", head]
          paths = subprocess.check_output(command).decode().split("\0")
          ignored = ("android/app/src/test/", "android/app/src/androidTest/", "android/app/schemas/", "android/docs/", "macos/Tests/", "macos/docs/")
          tooling = {"android/.gitignore", "android/README.md", "macos/.gitignore", "macos/README.md", "macos/Scripts/test.sh", "macos/Scripts/export-tag-fixtures.go", "macos/Scripts/update-tag-data.py"}
          paths = [path for path in paths if path and not path.startswith(ignored) and path not in tooling]
          shared = any(path in {".release-offset", "LICENSE"} for path in paths)
          macos = shared or any(path.startswith("macos/") for path in paths)
          release_workflow_changed = ".github/workflows/release.yml" in paths
          # Every public release needs a matching APK for GitHub-based Android updaters.
          android = macos or release_workflow_changed or any(path.startswith(("android/", "tools/release/", "shared/assets/")) for path in paths)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"android={str(android).lower()}\nmacos={str(macos).lower()}\n")
          PY
      - id: version
        run: |
          code=$(($(git rev-list --count HEAD) + $(cat .release-offset)))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=0.1.$code" >> "$GITHUB_OUTPUT"
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MEMOIZE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MEMOIZE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MEMOIZE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MEMOIZE_ANDROID_CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-37.1 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Materialize signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 tools/release/android-key.py
      - name: Build signed APK
        env:
          VERSION_NAME: ${{ needs.changes.outputs.version-name }}
          VERSION_CODE: ${{ needs.changes.outputs.version-code }}
        run: android/gradlew -p android -PmemoizeVersionName="$VERSION_NAME" -PmemoizeVersionCode="$VERSION_CODE" assembleRelease
      - name: Verify and stage APK
        env:
          VERSION_NAME: ${{ needs.changes.outputs.version-name }}
          VERSION_CODE: ${{ needs.changes.outputs.version-code }}
        run: |
          python3 tools/release/verify-apk.py --apk android/app/build/outputs/apk/release/app-release.apk --version-name "$VERSION_NAME" --version-code "$VERSION_CODE"
          python3 tools/release/stage-android.py
      - name: Upload Android release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: android/build/release/
          if-no-files-found: error
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/memoize-production-signing.keystore"
  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load stable Mac signing identity
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: python3 macos/Scripts/mac-signing.py setup
      - name: Build and sign update package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION_NAME: ${{ needs.changes.outputs.version-name }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          test -n "$MACOS_SIGNING_IDENTITY"
          macos/Scripts/release.sh "$VERSION_NAME"
      - name: Upload Mac release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: macos/build/release/
          if-no-files-found: error
      - name: Remove temporary Mac signing keychain
        if: always() && env.MACOS_SIGNING_DIRECTORY != ''
        run: python3 macos/Scripts/mac-signing.py cleanup
  publish:
    needs: [changes, android, macos]
    if: ${{ !cancelled() && needs.android.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_MACOS: ${{ needs.changes.outputs.macos }}
          VERSION_NAME: ${{ needs.changes.outputs.version-name }}
        run: |
          tag="v$VERSION_NAME"
          apk="release-assets/Memoize-$VERSION_NAME.apk"
          manifest="release-assets/release.json"
          sums="release-assets/SHA256SUMS"
          feed="release-assets/appcast.xml"
          test -s "$apk" && test -s "$manifest" && test -s "$sums" || exit 1

          publish() {
            local release_tag="$1" latest="$2"
            shift 2
            local draft
            if draft=$(gh release view "$release_tag" --json isDraft --jq .isDraft 2>/dev/null); then
              if [[ "$draft" == true ]]; then
                gh release upload "$release_tag" "$@" --clobber
                gh release edit "$release_tag" --draft=false --latest="$latest"
              fi
            else
              gh release create "$release_tag" "$@" --target "$GITHUB_SHA" \
                --title "Memoize $VERSION_NAME" --notes "Build from $GITHUB_SHA." --latest="$latest"
            fi
          }

          previous=$(gh release view --json tagName,assets)
          previous_tag=$(jq -r .tagName <<< "$previous")
          if [[ "$BUILD_MACOS" == true ]]; then
            test -s "release-assets/Memoize-$VERSION_NAME.zip"
          else
            gh release download "$previous_tag" --pattern appcast.xml --pattern "Memoize-*.zip" --dir release-assets
          fi
          test -s "$feed"

          # Upgrade installations that only recognize the former Android channel.
          if jq -e '.assets | all(.name != "release.json")' <<< "$previous" >/dev/null; then
            legacy_tag="android/$tag"
            jq --arg tag "$legacy_tag" '.tag = $tag' "$manifest" > "$RUNNER_TEMP/release.json"
            publish "$legacy_tag" false "$apk" "$RUNNER_TEMP/release.json" "$sums"
          fi
          publish "$tag" true release-assets/*
