name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: memoize-release
  cancel-in-progress: false
  queue: max
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MEMOIZE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MEMOIZE_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      MEMOIZE_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      MEMOIZE_ANDROID_CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-37.1 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - id: version
        run: |
          number=$(($(git rev-list --count HEAD) + $(cat .release-offset)))
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "name=0.1.$number" >> "$GITHUB_OUTPUT"
      - name: Materialize signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 tools/release/android-key.py
      - name: Build signed APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.number }}
        run: android/gradlew -p android -PmemoizeVersionName="$VERSION_NAME" -PmemoizeVersionCode="$VERSION_CODE" assembleRelease
      - name: Verify and stage APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.number }}
        run: |
          python3 tools/release/verify-apk.py --apk android/app/build/outputs/apk/release/app-release.apk --version-name "$VERSION_NAME" --version-code "$VERSION_CODE"
          python3 tools/release/stage-android.py
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gh release create "android/v$VERSION_NAME" android/build/release/* --target "$GITHUB_SHA" --title "Memoize Android $VERSION_NAME" --notes "Android APK built from $GITHUB_SHA." --latest=false
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/memoize-production-signing.keystore"
  macos:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: echo "name=0.1.$(($(git rev-list --count HEAD) + $(cat .release-offset)))" >> "$GITHUB_OUTPUT"
      - name: Load stable Mac signing identity from BWS
        env:
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
        run: |
          curl --fail --silent --show-error --location https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-macos-universal-2.1.0.zip --output "$RUNNER_TEMP/bws.zip"
          unzip -q "$RUNNER_TEMP/bws.zip" -d "$RUNNER_TEMP/bws-cli"
          echo "$RUNNER_TEMP/bws-cli" >> "$GITHUB_PATH"
          PATH="$RUNNER_TEMP/bws-cli:$PATH" python3 macos/Scripts/mac-signing.py setup
      - name: Build and sign update package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          test -n "$MACOS_SIGNING_IDENTITY"
          macos/Scripts/release.sh "$VERSION_NAME"
      - name: Publish Mac release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: gh release create "v$VERSION_NAME" macos/build/release/* --target "$GITHUB_SHA" --title "Memoize Mac $VERSION_NAME" --notes "Mac update built from $GITHUB_SHA." --latest
      - name: Remove temporary Mac signing keychain
        if: always() && env.MACOS_SIGNING_DIRECTORY != ''
        run: python3 macos/Scripts/mac-signing.py cleanup
